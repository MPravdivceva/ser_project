{% extends 'base.html' %}

{% block title %}Emotion Prediction - SER Project{% endblock %}

{% block content %}

<!-- Prediction Page Content -->
<div class="prediction-container" id="prediction-box">
    <h2>Result</h2>
    
    <p class="emotion-text">Detected Emotion: <span id="emotion-text">{{ emotion }}</span></p>
    
    <!-- Dynamic Emotion GIF -->
    <img id="emotion-gif" class="emotion-gif" src="" alt="Emotion Animation">

    <br>
    <a href="{{ url_for('index') }}" class="try-again">Try Again</a>
</div>

<!-- Dynamic Effects Based on Emotion -->
<script>
    var emotion = "{{ emotion }}";  
    var emotionText = document.getElementById("emotion-text");
    var emotionGif = document.getElementById("emotion-gif");
    var predictionBox = document.getElementById("prediction-box");

    // Define Emotion Styles & GIFs
    var emotionStyles = {
        "Anger": { color: "#000000", gif: "/static/anger.gif", bg: "#ED2021" },
        "Frustration": { color: "#000000", gif: "/static/frustration.gif", bg: "#BB59D7" },
        "Happiness": { color: "#000000", gif: "/static/cat-16676_128.gif", bg: "#FFDE59" },
        "Neutral": { color: "#000000", gif: "/static/neutral.gif", bg: "#EFC3CA" },
        "Sad": { color: "#000000", gif: "/static/sad.gif", bg: "#4540D3" },
    };

    // Apply Styles Dynamically
    if (emotionStyles[emotion]) {
        emotionText.style.color = emotionStyles[emotion].color;
        emotionGif.src = emotionStyles[emotion].gif;
        predictionBox.style.backgroundColor = emotionStyles[emotion].bg; // Change the box
    }
</script>

{% endblock %}
